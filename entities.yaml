# Справочник сущностей Нейрогазеты.
#
# Используется в validate_and_fix(): каждая сущность из tags.entities и related[].entities
# приводится к каноническому имени отсюда. Сущности, которых здесь нет, проходят как есть
# и попадают в отчёт: python scripts/pipeline/entities.py --report
#
# Формат:   Каноническое имя: {type: <тип>, parent: <каноническое имя>, aliases: [вариант, вариант]}
#   type    — company | model | product | person | gov | place | org | law | tech
#   parent  — владелец/семейство (продукт → компания, модель → семейство → компания).
#             Людям parent не ставим: CEO — не часть компании в статистике.
#   aliases — варианты написания. Регистр, пробелы, дефисы, точки и «ё» учитываются
#             автоматически: «Nvidia», «NVIDIA», «GPT Image 2», «GPT-Image-2» склеятся сами.
#
# Правило канонического имени:
#   компании, продукты, модели, люди — в оригинальном написании (OpenAI, Sam Altman, Сбер);
#   страны, регионы и госорганы с устоявшимся русским названием — по-русски
#   (США, Китай, Белый дом, Пентагон, ЦРУ); аббревиатуры без русского аналога — как есть (NIST, FTC).

