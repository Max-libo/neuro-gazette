name: diag-tg
on:
  push:
    branches: [diag-tg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          for H in "%5B2a00:f940:2:2:1:1:0:193%5D:443" "31.31.196.172:443"; do
            echo "=== TCP $H"
            R=$(curl -sS -m 20 -H "Accept: application/json" "https://check-host.net/check-tcp?host=$H&max_nodes=10")
            echo "$R" | head -c 300; echo
            ID=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin)['request_id'])")
            sleep 20; [ -n "$ID" ] && curl -sS -m 20 -H "Accept: application/json" "https://check-host.net/check-result/$ID"; echo
          done
