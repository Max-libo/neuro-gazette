name: diag-tg
on:
  push:
    branches: [diag-tg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          H=xn--80aahhcll4alt1a.xn--p1ai
          for NS in ns1.hosting.reg.ru ns2.hosting.reg.ru 1.1.1.1 8.8.8.8; do
            echo "=== @$NS  A: $(dig +short A $H @$NS | tr '\n' ' ') | AAAA: $(dig +short AAAA $H @$NS | tr '\n' ' ') | www AAAA: $(dig +short AAAA www.$H @$NS | tr '\n' ' ')"
          done
