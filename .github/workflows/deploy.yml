name: Deploy site to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Вызывается из daily.yml после сбора выпуска
  # (пуш от GITHUB_TOKEN сам по себе этот воркфлоу не запускает)
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # При вызове из daily.yml нужен свежий main с только что
          # закоммиченным выпуском, а не коммит, с которого стартовал запуск
          ref: main

      - name: Deploy docs folder via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./docs/
          server-dir: /
          exclude: |
            editor/**
